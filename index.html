<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopVanilla — E-Commerce</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="header">
    <h1>ShopVanilla</h1>
    <input class="search-input" type="text" placeholder="Search products..." id="searchInput">
    <button class="cart-btn" id="cartBtn">
      <ion-icon name="bag-outline" class="cart-shopping""></ion-icon>
            <span class=" cart-count" id="cartCount">0</span>
    </button>
  </header>

  <main class="main">
    <aside class="sidebar">

      <div class="sidebar-section">
        <h3>Category</h3>
        <div class="filter-group" id="categoryFilters"></div>
      </div>


      <div class="sidebar-section">
        <h3>Sort by</h3>
        <div class="dropdown" id="categoryDropdown">
          <button class="dropdown__trigger">
            <span id="selectedCategory">Default</span>
            <span class="dropdown__arrow">⌄</span>
          </button>

          <ul class="dropdown__menu">
            <li data-value="default">Default</li>
            <li data-value="price-asc">Price: Low to High</li>
            <li data-value="price-desc">Price: High to Low</li>
            <li data-value="title-asc">Name: A to Z</li>
            <li data-value="rating-desc">Top Rated</li>
          </ul>
        </div>
      </div>

      <div class="sidebar-section">
        <h3>Max Price</h3>
        <div class="price-range">
          <input type="range" id="priceRange" min="0" max="500" value="500" step="10">
          <label>Up to $<span id="priceLabel">700</span></label>
        </div>
      </div>
    </aside>

    <section class="content">
      <div class="products-grid" id="productsGrid"></div>
    </section>
  </main>

  <div class="backdrop" id="backdrop"></div>

  <div class="cart-overlay" id="cartOverlay">
    <div class="cart-header">
      <h2>Your cart</h2>
      <button class="close-btn" id="closeCart">Close</button>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-footer">
      <div class="cart-total">
        <span>Total</span>
        <span id="cartTotal">$0.00</span>
      </div>
      <button class="checkout-btn" id="checkoutBtn">Checkout</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module" src="https://unpkg.com/ionicons@5.2.3/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule="" src="https://unpkg.com/ionicons@5.2.3/dist/ionicons/ionicons.js"></script>
  <script type="module" src="script.js"></script>
</body>

</html>
